# lint.yml — PR / push-to-main gate.
#
# Cheap, fast, CPU-only. Runs on every PR and on push to main: ruff (check + format), the
# stdlib-only tests under scripts/misc/test, the "committed catalogue is current and
# validates with the PyAutoPulse reader" check, and a lychee link check over README.md and
# AGENTS.md. No PyAuto library is installed and no measurement cell runs.

name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install ruff pytest pyyaml
          # lychee is a Rust binary; fetch the prebuilt release. The tarball
          # nests everything under lychee-x86_64-unknown-linux-gnu/, so strip
          # that leading directory and extract just the binary.
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Checked out after ruff so the Pulse tree is never linted as this repo's code.
      - name: Checkout PyAutoPulse (the profiling-summary@2 reader)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoPulse
          path: _pulse

      - name: pytest (stdlib-only tooling tests)
        run: python -m pytest -q scripts/misc/test

      - name: catalogue up to date and valid profiling-summary@2
        run: python scripts/misc/tooling/build_catalogue.py --check --validate-with _pulse

      - name: lychee — markdown link-rot
        run: |
          # Exclude GitHub UI links that lychee tends to false-positive on, and the
          # Slack invite (302 -> 403 to any non-browser client).
          lychee \
            --exclude '^https://github\.com/.*/(issues|pull|commit|releases)/' \
            --exclude '^https://join\.slack\.com/' \
            --no-progress \
            --accept '200..=299,429' \
            --max-redirects 5 \
            README.md AGENTS.md
