# lint.yml — PR / push-to-main gate.
#
# Cheap, fast, CPU-only. Runs on every PR and on push to main. It lints only what exists
# in the skeleton: ruff (check + format) and a lychee link check over README.md and
# AGENTS.md. No PyAuto library is installed and no script runs; the pytest and smoke legs
# arrive with the harness in a later phase of the search-extensibility epic.

name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install ruff
          # lychee is a Rust binary; fetch the prebuilt release. The tarball
          # nests everything under lychee-x86_64-unknown-linux-gnu/, so strip
          # that leading directory and extract just the binary.
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: lychee — markdown link-rot
        run: |
          # Exclude GitHub UI links that lychee tends to false-positive on, and the
          # Slack invite (302 -> 403 to any non-browser client).
          lychee \
            --exclude '^https://github\.com/.*/(issues|pull|commit|releases)/' \
            --exclude '^https://join\.slack\.com/' \
            --no-progress \
            --accept '200..=299,429' \
            --max-redirects 5 \
            README.md AGENTS.md
